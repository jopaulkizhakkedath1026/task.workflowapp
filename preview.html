<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowTask — Agile Task Workflow Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --border: #e2e8f0;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);

      --col-todo: #64748b;
      --col-progress: #0284c7;
      --col-review: #d97706;
      --col-done: #16a34a;

      --prio-low: #10b981;
      --prio-med: #0284c7;
      --prio-high: #f59e0b;
      --prio-urgent: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-page);
      line-height: 1.5;
      min-height: 100vh;
    }

    .navbar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--primary), #818cf8);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 1.1rem;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-page);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .conn-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      background: #ecfdf5;
      color: #047857;
    }

    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    .stats-ribbon {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stat-info h4 {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .stat-info .stat-num {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 4px;
    }

    .stat-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .filter-toolbar {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow-sm);
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      display: flex;
      align-items: center;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .filter-selects {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .select-ctrl {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      background: white;
      color: var(--text-main);
      outline: none;
      font-family: inherit;
    }

    .kanban-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      align-items: flex-start;
    }

    .kanban-column {
      background: #f1f5f9;
      border-radius: var(--radius-lg);
      padding: 16px;
      border: 1px solid #e2e8f0;
      min-height: 480px;
      display: flex;
      flex-direction: column;
    }

    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
    }

    .column-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .column-count {
      background: white;
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid var(--border);
    }

    .tasks-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .task-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s, box-shadow 0.15s;
      cursor: pointer;
    }

    .task-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .task-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .task-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      word-break: break-word;
    }

    .task-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .task-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
    }

    .prio-badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .prio-low { background: #ecfdf5; color: #047857; }
    .prio-medium { background: #e0f2fe; color: #0369a1; }
    .prio-high { background: #fef3c7; color: #b45309; }
    .prio-urgent { background: #fee2e2; color: #b91c1c; }

    .due-date {
      color: var(--text-muted);
      font-weight: 500;
    }

    .due-date.overdue {
      color: #ef4444;
      font-weight: 700;
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 10px;
      justify-content: flex-end;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      transition: all 0.15s;
    }

    .btn-icon:hover {
      background: #f1f5f9;
      color: var(--text-main);
    }

    .btn-icon.delete:hover {
      background: #fee2e2;
      color: #b91c1c;
      border-color: #fca5a5;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: background-color 0.15s;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: white; color: var(--text-main); border: 1px solid var(--border); }
    .btn-outline:hover { background: #f8fafc; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal-dialog {
      background: var(--bg-card);
      width: 100%;
      max-width: 520px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 { font-size: 1.15rem; font-weight: 700; }
    .btn-close { background: transparent; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text-muted); }

    .modal-body { padding: 22px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; font-family: inherit; outline: none;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: var(--primary);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-error { color: #ef4444; font-size: 0.78rem; margin-top: 4px; display: none; }

    .modal-footer {
      padding: 16px 22px; background: #f8fafc; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px;
    }

    @media (max-width: 1024px) {
      .kanban-board { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .kanban-board { grid-template-columns: 1fr; }
      .filter-toolbar { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <div class="brand">
        <div class="brand-icon">✓</div>
        <div>
          <div class="brand-title">FlowTask</div>
          <div class="brand-subtitle">MERN Task Workflow Dashboard</div>
        </div>
      </div>
      <div class="nav-actions">
        <span class="conn-status" id="connStatus">● Localhost Online</span>
        <button class="btn btn-primary" onclick="openCreateModal()">+ New Task</button>
        <div class="user-badge">
          <span>👤</span>
          <span id="userNameLabel">Jopaul Kizhakkedath</span>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-content">
    
    <div class="stats-ribbon">
      <div class="stat-card">
        <div class="stat-info">
          <h4>Total Tasks</h4>
          <div class="stat-num" id="stat-total">0</div>
        </div>
        <div class="stat-dot" style="background: var(--primary);"></div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <h4>To Do</h4>
          <div class="stat-num" id="stat-todo">0</div>
        </div>
        <div class="stat-dot" style="background: var(--col-todo);"></div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <h4>In Progress</h4>
          <div class="stat-num" id="stat-in_progress">0</div>
        </div>
        <div class="stat-dot" style="background: var(--col-progress);"></div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <h4>Review</h4>
          <div class="stat-num" id="stat-review">0</div>
        </div>
        <div class="stat-dot" style="background: var(--col-review);"></div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <h4>Completed</h4>
          <div class="stat-num" id="stat-done">0</div>
        </div>
        <div class="stat-dot" style="background: var(--col-done);"></div>
      </div>
    </div>

    <div class="filter-toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search tasks by title or details..." oninput="applyFilters()">
      </div>
      <div class="filter-selects">
        <select class="select-ctrl" id="priorityFilter" onchange="applyFilters()">
          <option value="">All Priorities</option>
          <option value="low">Low Priority</option>
          <option value="medium">Medium Priority</option>
          <option value="high">High Priority</option>
          <option value="urgent">Urgent</option>
        </select>
        <select class="select-ctrl" id="statusFilter" onchange="applyFilters()">
          <option value="">All Stages</option>
          <option value="todo">To Do</option>
          <option value="in_progress">In Progress</option>
          <option value="review">Review</option>
          <option value="done">Completed</option>
        </select>
        <button class="btn btn-outline" onclick="resetFilters()">Reset</button>
      </div>
    </div>

    <div class="kanban-board">
      
      <div class="kanban-column" id="col-todo">
        <div class="column-header">
          <div class="column-title">
            <span style="color: var(--col-todo); font-size: 1.2rem;">●</span>
            <span>To Do</span>
          </div>
          <span class="column-count" id="count-todo">0</span>
        </div>
        <div class="tasks-list" id="list-todo"></div>
        <button class="btn btn-outline" style="margin-top: 14px; width: 100%; font-size: 0.82rem;" onclick="openCreateModal('todo')">+ Add Card</button>
      </div>

      <div class="kanban-column" id="col-in_progress">
        <div class="column-header">
          <div class="column-title">
            <span style="color: var(--col-progress); font-size: 1.2rem;">●</span>
            <span>In Progress</span>
          </div>
          <span class="column-count" id="count-in_progress">0</span>
        </div>
        <div class="tasks-list" id="list-in_progress"></div>
        <button class="btn btn-outline" style="margin-top: 14px; width: 100%; font-size: 0.82rem;" onclick="openCreateModal('in_progress')">+ Add Card</button>
      </div>

      <div class="kanban-column" id="col-review">
        <div class="column-header">
          <div class="column-title">
            <span style="color: var(--col-review); font-size: 1.2rem;">●</span>
            <span>Review</span>
          </div>
          <span class="column-count" id="count-review">0</span>
        </div>
        <div class="tasks-list" id="list-review"></div>
        <button class="btn btn-outline" style="margin-top: 14px; width: 100%; font-size: 0.82rem;" onclick="openCreateModal('review')">+ Add Card</button>
      </div>

      <div class="kanban-column" id="col-done">
        <div class="column-header">
          <div class="column-title">
            <span style="color: var(--col-done); font-size: 1.2rem;">●</span>
            <span>Completed</span>
          </div>
          <span class="column-count" id="count-done">0</span>
        </div>
        <div class="tasks-list" id="list-done"></div>
        <button class="btn btn-outline" style="margin-top: 14px; width: 100%; font-size: 0.82rem;" onclick="openCreateModal('done')">+ Add Card</button>
      </div>

    </div>

  </div>

  <div class="modal-overlay" id="taskModal" onclick="closeModal()">
    <div class="modal-dialog" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modalTitle">Create New Task</h3>
        <button class="btn-close" onclick="closeModal()">×</button>
      </div>
      <form id="taskForm" onsubmit="handleFormSubmit(event)">
        <div class="modal-body">
          <input type="hidden" id="editTaskId" value="">

          <div class="form-group">
            <label for="formTitle">Task Title *</label>
            <input type="text" id="formTitle" placeholder="e.g. Implement JWT authentication middleware" required>
            <div class="form-error" id="titleError">Title is required.</div>
          </div>

          <div class="form-group">
            <label for="formDesc">Description</label>
            <textarea id="formDesc" rows="3" placeholder="Task context, acceptance criteria, or technical details..."></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="formStatus">Workflow Stage</label>
              <select id="formStatus">
                <option value="todo">To Do</option>
                <option value="in_progress">In Progress</option>
                <option value="review">Review</option>
                <option value="done">Completed</option>
              </select>
            </div>
            <div class="form-group">
              <label for="formPriority">Priority</label>
              <select id="formPriority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="formDueDate">Due Date</label>
            <input type="date" id="formDueDate">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STAGES = ['todo', 'in_progress', 'review', 'done'];
    const isHttp = window.location.protocol.startsWith('http');
    let hasBackend = false;

    let tasks = [];

    // Fallback tasks
    const DEFAULT_TASKS = [
      {
        id: '1',
        title: 'Define Project MVP & User Stories',
        description: 'Document acceptance criteria, roles, wireframes, and API contracts in README.',
        status: 'done',
        priority: 'high',
        dueDate: '2023-05-10'
      },
      {
        id: '2',
        title: 'Setup MongoDB Atlas & Mongoose Schemas',
        description: 'Configure User and Task models with strict field validation and indexes.',
        status: 'done',
        priority: 'urgent',
        dueDate: '2023-05-12'
      },
      {
        id: '3',
        title: 'Implement JWT Auth & Ownership Verification',
        description: 'Ensure registered users can only see, edit, and delete their own workflow tasks.',
        status: 'in_progress',
        priority: 'high',
        dueDate: '2023-05-18'
      },
      {
        id: '4',
        title: 'Build Controlled Task Modal Form',
        description: 'Implement four UI states: Loading, Success, Empty, and Error banners.',
        status: 'review',
        priority: 'medium',
        dueDate: '2023-05-20'
      },
      {
        id: '5',
        title: 'Automated End-to-End API Testing',
        description: 'Test all endpoints in Postman / Thunder Client with valid and edge case inputs.',
        status: 'todo',
        priority: 'medium',
        dueDate: '2023-05-24'
      }
    ];

    async function initData() {
      if (isHttp) {
        try {
          const res = await fetch('/api/tasks');
          if (res.ok) {
            const data = await res.json();
            if (data.tasks) {
              tasks = data.tasks;
              hasBackend = true;
              document.getElementById('connStatus').textContent = '● REST API Connected';
              document.getElementById('connStatus').style.background = '#ecfdf5';
              document.getElementById('connStatus').style.color = '#047857';
              renderBoard();
              return;
            }
          }
        } catch (e) {
          console.warn('Backend not responding, using local persistence');
        }
      }

      // Local storage fallback
      tasks = JSON.parse(localStorage.getItem('flowtasks') || 'null');
      if (!tasks || !Array.isArray(tasks)) {
        tasks = DEFAULT_TASKS;
        localStorage.setItem('flowtasks', JSON.stringify(tasks));
      }
      document.getElementById('connStatus').textContent = '● Local Storage Mode';
      document.getElementById('connStatus').style.background = '#eff6ff';
      document.getElementById('connStatus').style.color = '#1d4ed8';
      renderBoard();
    }

    async function persistTask(task, isNew) {
      if (hasBackend) {
        try {
          if (isNew) {
            const res = await fetch('/api/tasks', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(task)
            });
            const data = await res.json();
            if (data.task) return data.task;
          } else {
            const res = await fetch(`/api/tasks/${task.id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(task)
            });
            const data = await res.json();
            if (data.task) return data.task;
          }
        } catch (err) {
          console.error('API call failed, saving locally:', err);
        }
      }

      // Local storage update
      localStorage.setItem('flowtasks', JSON.stringify(tasks));
      return task;
    }

    async function removeTaskFromDB(id) {
      if (hasBackend) {
        try {
          await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
        } catch (err) {
          console.error('API delete failed:', err);
        }
      }
      localStorage.setItem('flowtasks', JSON.stringify(tasks));
    }

    function openCreateModal(stage = 'todo') {
      document.getElementById('editTaskId').value = '';
      document.getElementById('modalTitle').textContent = 'Create New Task';
      document.getElementById('formTitle').value = '';
      document.getElementById('formDesc').value = '';
      document.getElementById('formStatus').value = stage;
      document.getElementById('formPriority').value = 'medium';
      document.getElementById('formDueDate').value = '';
      document.getElementById('titleError').style.display = 'none';
      document.getElementById('taskModal').classList.add('active');
    }

    function openEditModal(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      document.getElementById('editTaskId').value = task.id;
      document.getElementById('modalTitle').textContent = 'Edit Task';
      document.getElementById('formTitle').value = task.title;
      document.getElementById('formDesc').value = task.description || '';
      document.getElementById('formStatus').value = task.status;
      document.getElementById('formPriority').value = task.priority;
      document.getElementById('formDueDate').value = task.dueDate || '';
      document.getElementById('titleError').style.display = 'none';
      document.getElementById('taskModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('taskModal').classList.remove('active');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const title = document.getElementById('formTitle').value.trim();
      if (!title) {
        document.getElementById('titleError').style.display = 'block';
        return;
      }

      const id = document.getElementById('editTaskId').value;
      const desc = document.getElementById('formDesc').value.trim();
      const status = document.getElementById('formStatus').value;
      const priority = document.getElementById('formPriority').value;
      const dueDate = document.getElementById('formDueDate').value;

      if (id) {
        const existing = tasks.find(t => t.id === id);
        if (existing) {
          existing.title = title;
          existing.description = desc;
          existing.status = status;
          existing.priority = priority;
          existing.dueDate = dueDate;
          await persistTask(existing, false);
        }
      } else {
        const newTask = {
          id: Date.now().toString(),
          title,
          description: desc,
          status,
          priority,
          dueDate
        };
        const saved = await persistTask(newTask, true);
        tasks.unshift(saved || newTask);
      }

      closeModal();
      renderBoard();
    }

    async function moveStage(id, direction) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      const currentIndex = STAGES.indexOf(task.status);
      const nextIndex = currentIndex + direction;
      if (nextIndex >= 0 && nextIndex < STAGES.length) {
        task.status = STAGES[nextIndex];
        await persistTask(task, false);
        renderBoard();
      }
    }

    async function deleteTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      if (confirm(`Delete task "${task.title}"?`)) {
        tasks = tasks.filter(t => t.id !== id);
        await removeTaskFromDB(id);
        renderBoard();
      }
    }

    function applyFilters() {
      renderBoard();
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('priorityFilter').value = '';
      document.getElementById('statusFilter').value = '';
      renderBoard();
    }

    function renderBoard() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const priority = document.getElementById('priorityFilter').value;
      const stageFilter = document.getElementById('statusFilter').value;

      const filtered = tasks.filter(t => {
        const matchesSearch = !search || t.title.toLowerCase().includes(search) || (t.description && t.description.toLowerCase().includes(search));
        const matchesPriority = !priority || t.priority === priority;
        const matchesStage = !stageFilter || t.status === stageFilter;
        return matchesSearch && matchesPriority && matchesStage;
      });

      document.getElementById('stat-total').textContent = tasks.length;
      STAGES.forEach(st => {
        const count = tasks.filter(t => t.status === st).length;
        document.getElementById(`stat-${st}`).textContent = count;
        document.getElementById(`count-${st}`).textContent = filtered.filter(t => t.status === st).length;
      });

      STAGES.forEach(st => {
        const listEl = document.getElementById(`list-${st}`);
        const colTasks = filtered.filter(t => t.status === st);

        if (colTasks.length === 0) {
          listEl.innerHTML = `
            <div style="padding: 24px 12px; text-align: center; color: #94a3b8; font-size: 0.85rem; border: 2px dashed #e2e8f0; border-radius: 8px;">
              No tasks in this stage
            </div>
          `;
          return;
        }

        listEl.innerHTML = colTasks.map(t => {
          const currentIndex = STAGES.indexOf(t.status);
          const canBack = currentIndex > 0;
          const canForward = currentIndex < STAGES.length - 1;

          return `
            <div class="task-card" onclick="openEditModal('${t.id}')">
              <div class="task-card-header">
                <h4 class="task-title">${escapeHtml(t.title)}</h4>
                <span class="prio-badge prio-${t.priority}">${t.priority}</span>
              </div>
              ${t.description ? `<p class="task-desc">${escapeHtml(t.description)}</p>` : ''}
              <div class="task-card-meta">
                <span class="due-date">${t.dueDate ? '📅 ' + t.dueDate : 'No due date'}</span>
                <div class="task-actions" onclick="event.stopPropagation()">
                  ${canBack ? `<button class="btn-icon" title="Move back" onclick="moveStage('${t.id}', -1)">◀</button>` : ''}
                  ${canForward ? `<button class="btn-icon" title="Advance stage" onclick="moveStage('${t.id}', 1)">▶</button>` : ''}
                  <button class="btn-icon" title="Edit" onclick="openEditModal('${t.id}')">✏️</button>
                  <button class="btn-icon delete" title="Delete" onclick="deleteTask('${t.id}')">🗑️</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    initData();
  </script>
</body>
</html>
